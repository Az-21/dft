name: dft
description: Calculate Discrete Fourier Transform using Radix2 Algorithm.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 2.6.1+35

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  complex: ^0.8.0
  meta: ^1.9.0
  syncfusion_flutter_charts: ^34.2.6
  url_launcher: ^6.1.11
  dynamic_color: ^1.9.0
  flutter_animate: ^4.1.1+1
  go_router: ^18.0.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  lint: ^2.1.2

flutter:
  uses-material-design: true

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMonoNL-Medium.ttf
