# Strict static analysis baseline for this project
#
# Combines the recommended `flutter_lints` set with Dart strict mode and a
# curated set of additional lints. The formatter width below is authoritative:
# run `dart format` to apply it. Keep this file warning-free and treat new
# diagnostics as build failures.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
  language:
    # Disallow implicit downcasts from `dynamic`
    strict-casts: true
    # Require explicit types where inference would fall back to `dynamic`
    strict-inference: true
    # Disallow raw generic types such as `List` without type arguments
    strict-raw-types: true

formatter:
  page_width: 120

linter:
  rules:
    # Top-level and member declarations must state their return type
    always_declare_return_types: true
    # Prefer single quotes inside interpolations instead of escaping doubles
    avoid_escaping_inner_quotes: true
    # Flag arguments that repeat the parameter default
    avoid_redundant_argument_values: true
    # Reach packages through `package:` imports, never relative `lib/` paths
    avoid_relative_lib_imports: true
    # Await only genuine futures, never plain values
    await_only_futures: true
    # Cancel stream subscriptions in `dispose`
    cancel_subscriptions: true
    # Casts must not silently drop nullability
    cast_nullable_to_non_nullable: true
    # Close sinks such as stream controllers when done
    close_sinks: true
    # Documentation `[references]` must resolve to real declarations
    comment_references: true
    # Fail on imports of packages that are only transitive dependencies
    depend_on_referenced_packages: true
    # Keep imports sorted with `dart:` first and `package:` alphabetical
    directives_ordering: true
    # Switches over enums and sealed types must cover every case
    exhaustive_cases: true
    # Public API must not leak private types
    library_private_types_in_public_api: true
    # Switch cases must not repeat the same value
    no_duplicate_case_values: true
    # Library prefixes use `lower_snake_case` without leading underscores
    no_leading_underscores_for_library_prefixes: true
    # Assignments must change the value, never copy a variable onto itself
    no_self_assignments: true
    # Wildcard `_` stays a placeholder and is never read
    no_wildcard_variable_uses: true
    # Only throw `Exception`, `Error`, or subtypes of them
    only_throw_errors: true
    # Unnamed libraries stay unnamed; named ones use the package prefix
    package_prefixed_library_names: true
    # Strings use double quotes; single quotes appear only to avoid escaping
    prefer_double_quotes: true
    # Fields assigned once are `final`
    prefer_final_fields: true
    # Locals assigned once are `final`
    prefer_final_locals: true
    # Async gaps and discarded futures must be explicit
    unawaited_futures: true
    # Prefer tear-offs over lambdas that only forward the call
    unnecessary_lambdas: true
    # Never use `BuildContext` across an async gap without a mounted check
    use_build_context_synchronously: true
